{% extends "base.html" %}
{% block title %}{{ title }} · Hệ thống quản lý chi tiêu{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <p>Bạn chắc chắn muốn xóa <strong>{{ object }}</strong>?</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn-danger" type="submit">Xóa</button>
    <a class="btn btn-ghost" href="{{ cancel_url }}">Giữ lại</a>
  </form>
</div>
{% endblock %}
